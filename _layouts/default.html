<!doctype html>
<html lang="{{ site.lang }}">
<head>
{% include head.html %}
</head>
<body class="{{ page.body_class | default: 'page' }}">
{% include icons.html %}
<div class="grain" aria-hidden="true"></div>
<div class="cursor-glow" aria-hidden="true"></div>
{% include header.html %}
<div class="wrap ad-wrap">{% include ad.html slot="top" %}</div>
<main id="conteudo">
{{ content }}
</main>
{% include footer.html %}

<script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>

</html>
