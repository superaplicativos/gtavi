# =============================================================
#  GTA VI DETONA BR: configuração central do site (Jekyll)
#  Leia AGENTS.md antes de editar. Tudo que é "global" fica aqui.
# =============================================================

title: "GTA VI Detona BR"
tagline: "O portal brasileiro mais insano sobre GTA VI"
description: >-
  Notícias diárias, cheats, dicas, easter eggs, descobertas e rumores sobre
  GTA VI (e o futuro GTA VII). Portal de fã brasileiro, independente e não oficial.
lang: pt-BR
locale: pt_BR
timezone: America/Sao_Paulo

# URL pública. Para GitHub Pages de projeto: https://USUARIO.github.io + baseurl /gtavi
# Se um dia usar domínio próprio (recomendado p/ anúncios), troque url e deixe baseurl: ""
url: "https://superaplicativos.github.io"
baseurl: "/gtavi"

author:
  name: "Equipe GTA VI Detona BR"

# ---------- Redes sociais ----------
social:
  youtube: "https://www.youtube.com/@gtavidetonabr"
  youtube_label: "GTA VI Detona BR no YouTube"
  instagram: ""
  tiktok: ""
  x: ""

# ---------- Lançamento (usado no contador do hero) ----------
launch_date: "2026-11-19T00:00:00-03:00"

# ---------- Anúncios (ver docs/MONETIZACAO.md) ----------
# Trocar de rede = mudar "provider" e ligar/desligar "enabled". Os códigos de
# cada rede ficam em _includes/ads/ (um arquivo por rede, um bloco por slot).
ads:
  enabled: true             # false = remove TODOS os banners do site de uma vez
  provider: "custom"        # custom = banners proprios de afiliado Mercado Livre (_includes/ads/custom.html); alternativas: adsterra | adsense
  socialbar: false          # Social Bar flutuante (Adsterra) - desligada por ser invasiva; true para voltar
  show_placeholders: false  # true só para ver onde os banners aparecem
  adsense_client: ""        # ex.: ca-pub-1234567890123456 (quando provider = adsense)
  slots:                    # IDs dos blocos criados no painel do AdSense
    top: ""
    infeed: ""
    article: ""
    sidebar: ""

# ---------- Analytics (opcional) ----------
analytics:
  gtm_id: "GTM-KJDP9TGB"  # container do Google Tag Manager (tag do Google), instalado em 23/11/2026
  ga4_id: ""              # ex.: G-XXXXXXX (usado só se o GTM estiver vazio)

# ---------- Indexação / consoles de busca (opcional) ----------
# Cadastre o site e cole o código de verificação aqui; a meta tag é gerada
# automaticamente pelo jekyll-seo-tag em todas as páginas.
# Google: https://search.google.com/search-console  |  Bing: https://www.bing.com/webmasters
webmaster_verifications:
  google: "Ti_ocqoKkhviHMyl84iGh_a7lhfOhPaRMrYRpkjdWzI"
  bing: ""
  yandex: ""

# ---------- Jekyll ----------
permalink: /:year/:month/:day/:title/
markdown: kramdown
kramdown:
  input: GFM
  auto_ids: true
highlighter: rouge
future: false
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

feed:
  path: feed.xml

defaults:
  - scope: { path: "", type: "posts" }
    values:
      layout: post
      author: "Equipe GTA VI Detona BR"
  - scope: { path: "" }
    values:
      image: /assets/img/og-default.png

exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - docs/
  - scripts/
  - Gemfile
  - Gemfile.lock
  - vendor/
