name: Imagens dos posts

# Gera capas/galerias (foto livre via Wikimedia Commons ou IA via Cloudflare FLUX / Pollinations)
# para posts que ainda não têm imagem, salva no repositório e republica o site.
on:
  push:
    branches: [main]
    paths: ["_posts/**"]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Slugs específicos (separados por espaço). Vazio = todos sem imagem."
        required: false
        default: ""

permissions:
  contents: write
  pages: write

concurrency:
  group: imagens
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar imagens
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: node scripts/capas.mjs ${{ github.event.inputs.slugs }}
      - name: Commit
        id: commit
        run: |
          git config user.name "gtavi-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/img/posts _posts
          if git diff --cached --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "img: capas e galerias automáticas"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Republicar GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds"
